name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    # A handful of backend/tests/ don't override the DB dependency and rely
    # on FastAPI rejecting invalid params before the route ever reaches it
    # -- discovered while setting up this workflow that this assumption
    # doesn't hold, and those tests genuinely try to connect. Locally this
    # goes unnoticed because a real Postgres from `docker compose up -d`
    # happens to already be running; CI has no such thing lying around, so
    # give it the same real (but freshly-schema'd, empty) database instead
    # of trying to relitigate which tests "should" need one.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Install straight from requirements.txt (the single source of truth)
      # instead of a hand-maintained version list -- that list drifted out
      # of sync once Step 10 made backend/app/ itself import pymupdf/torch/
      # easyocr/openai (previously only spike/ needed them), and CI started
      # failing with ModuleNotFoundError: No module named 'fitz' as a
      # result. requirements.txt already carries the --extra-index-url line
      # torch's +cpu wheel needs, so pip picks it up automatically.
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Apply database schema
        run: PGPASSWORD=ci psql -h localhost -U ci -d ci -f database/schema.sql
      - run: pytest backend/tests/
