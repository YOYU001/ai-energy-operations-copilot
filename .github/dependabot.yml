version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # typescript-eslint's peer range is ">=4.8.4 <6.1.0" (see
      # typescript-eslint/typescript-eslint#10940) -- TS 7.0 breaks
      # `npm run lint` outright. Remove this once that issue closes.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
      # eslint-plugin-react (pulled in via eslint-config-next) breaks under
      # ESLint 10 -- it calls the removed `context.getFilename()` compat
      # shim. Remove this once eslint-config-next/eslint-plugin-react ship
      # ESLint 10 support.
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
